name: 매일 오전 9시 점검

# 00:00 UTC = 09:00 KST. GitHub 크론은 몇 분 늦게 뜰 수 있습니다.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 검사
        run: python3 scripts/validate.py

      - name: 점검 리포트 생성
        id: report
        run: |
          python3 scripts/daily_report.py > report.md
          {
            echo 'body<<REPORT_EOF'
            cat report.md
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 정리할 항목이 있으면 이슈로 올리기
        if: contains(steps.report.outputs.body, '정리 대상')
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.REPORT;
            const title = '나들이 달력 · 종료된 행사 정리 필요';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-refresh'
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['data-refresh']
              });
            }
        env:
          REPORT: ${{ steps.report.outputs.body }}
